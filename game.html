<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    viewport-fit=cover,
    user-scalable=no"
>

<title>Tube Empire — Studio</title>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<!-- Новая система игры -->
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/telegram.js"></script>
<script src="js/economy.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>

<style>

:root{
    --bg:#070305;
    --panel:#14080d;
    --panel2:#1c0b12;
    --border:rgba(255,50,80,.35);
    --accent:#ff2a5f;
    --gold:#ffd700;
    --text:#fff;
    --sub:#ff94a8;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,sans-serif;
}

body{
    padding:4px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.portal{
    width:100%;
    height:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    padding:8px;
    background:
        linear-gradient(
            145deg,
            #190c12,
            #080407
        );
    border:2px solid var(--border);
    border-radius:18px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
    padding:6px;
    background:#16090e;
    border:1px solid var(--border);
    border-radius:10px;
}

.header button,
.header a{
    border:1px solid rgba(255,255,255,.12);
    background:#241018;
    color:#fff;
    padding:6px 9px;
    border-radius:7px;
    font-size:9px;
    font-weight:700;
    text-decoration:none;
}

.header .menu{
    background:#d90429;
}

.body{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:7px;
    padding-top:7px;
    min-height:0;
}

.stats{
    display:flex;
    gap:6px;
}

.stat{
    flex:1;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.09);
    border-radius:10px;
    padding:7px;
    text-align:center;
}

.label{
    color:var(--sub);
    font-size:8px;
    font-weight:800;
    text-transform:uppercase;
}

.value{
    color:var(--gold);
    font-size:15px;
    font-weight:900;
    margin-top:2px;
}

.small{
    color:var(--sub);
    font-size:8px;
    margin-top:2px;
}

.trend{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 10px;
    border:1px dashed rgba(255,215,0,.3);
    border-radius:9px;
    background:rgba(255,215,0,.04);
    font-size:9px;
}

.studio{
    flex:0 0 78px;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid var(--border);
    border-radius:12px;
    background:
        radial-gradient(
            circle,
            #32101c,
            #0b0407
        );
    font-size:28px;
}

.action{
    display:flex;
    justify-content:center;
    align-items:center;
}

.tap-button{
    width:76px;
    height:76px;
    border-radius:50%;
    border:4px solid #fff;
    background:
        radial-gradient(
            circle at 35% 30%,
            #ff6b86,
            #ff174f 45%,
            #72001e
        );
    box-shadow:
        0 0 15px rgba(255,30,90,.5),
        inset 0 0 15px rgba(255,255,255,.2);
    color:#fff;
    font-size:24px;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
}

.tap-button:active{
    transform:scale(.91);
}

.donation{
    width:100%;
    border:1px solid var(--gold);
    background:#3a121d;
    color:var(--gold);
    border-radius:8px;
    padding:8px;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
}

.list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#180a10;
}

.card-name{
    color:var(--gold);
    font-size:9px;
    font-weight:800;
}

.card-desc{
    color:var(--sub);
    font-size:7px;
    margin-top:2px;
}

.card-count{
    color:#fff;
    font-size:10px;
    font-weight:900;
    background:#0005;
    padding:4px 7px;
    border-radius:6px;
}

.popup{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    color:var(--gold);
    font-size:13px;
    font-weight:900;
    animation:popup .55s ease-out forwards;
}

@keyframes popup{

    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    100%{
        opacity:0;
        transform:translateY(-35px) scale(1.15);
    }

}

</style>
</head>

<body>

<div class="portal">

    <div class="header">

        <a
            class="menu"
            href="index.html"
        >
            ⬅ МЕНЮ
        </a>

        <a href="collection.html">
            🛒 МАГАЗИН
        </a>

        <a href="avatar.html">
            🎨 СТУДИЯ
        </a>

    </div>


    <div class="body">

        <div class="stats">

            <div class="stat">

                <div class="label">
                    Баланс
                </div>

                <div
                    class="value"
                    id="money"
                >
                    0.00 €
                </div>

                <div
                    class="small"
                    id="income"
                >
                    +0.0 €/s
                </div>

            </div>


            <div class="stat">

                <div class="label">
                    Энергия
                </div>

                <div
                    class="value"
                    id="energy"
                >
                    100
                </div>

                <div
                    class="small"
                    id="energyRate"
                >
                    0.0/s
                </div>

            </div>

        </div>


        <div class="trend">

            <span>
                🔥 ТРЕНД
            </span>

            <span id="trend">
                x1.00
            </span>

        </div>


        <div class="studio">
            🎙️ 💻 💡
        </div>


        <button
            class="donation"
            id="donationButton"
        >
            🎁 ЗАБРАТЬ ДОХОД
        </button>


        <div class="action">

            <button
                class="tap-button"
                id="tapButton"
                type="button"
            >
                ▶
            </button>

        </div>


        <div
            class="list"
            id="upgradeList"
        ></div>

    </div>

</div>


<script>

(function(){

"use strict";


const upgrades = [

    {
        id:"desk",
        name:"💻 Стол монтажа",
        desc:"+1 €/с",
        cost:100,
        income:1
    },

    {
        id:"office",
        name:"🏢 Офис",
        desc:"+5 €/с",
        cost:500,
        income:5
    },

    {
        id:"clipmaker",
        name:"🧑‍💻 Клипмейкер",
        desc:"+15 €/с",
        cost:1500,
        income:15
    },

    {
        id:"camera",
        name:"🎥 Оператор",
        desc:"+50 €/с",
        cost:5000,
        income:50
    }

];


function state(){

    return GameState.getState();

}


function money(){

    return Number(
        GameState.get(
            "player.money",
            0
        )
    );

}


function energy(){

    return Number(
        GameState.get(
            "player.energy",
            100
        )
    );

}


function save(){

    GameStorage.save(
        GameState.getState()
    );

}


function formatMoney(value){

    return Number(value).toLocaleString(
        "ru-RU",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " €";

}


function render(){

    const s = state();


    document.getElementById(
        "money"
    ).textContent =
        formatMoney(
            s.player.money
        );


    document.getElementById(
        "energy"
    ).textContent =
        Number(
            s.player.energy
        ).toFixed(1);


    document.getElementById(
        "income"
    ).textContent =
        "+" +
        Number(
            s.economy.incomePerSecond
        ).toFixed(1) +
        " €/s";


    document.getElementById(
        "energyRate"
    ).textContent =
        Number(
            s.economy.energyPerSecond
        ).toFixed(1) +
        "/s";


    renderUpgrades();

}


function renderUpgrades(){

    const container =
        document.getElementById(
            "upgradeList"
        );


    const s = state();


    container.innerHTML =
        upgrades.map(
            item => {

                const count =
                    Number(
                        s.upgrades[item.id] || 0
                    );


                return `

                    <div
                        class="card"
                        data-upgrade="${item.id}"
                    >

                        <div>

                            <div class="card-name">
                                ${item.name}
                            </div>

                            <div class="card-desc">
                                ${item.desc}
                                ·
                                ${item.cost.toLocaleString("ru-RU")} €
                            </div>

                        </div>

                        <div class="card-count">
                            ${count}
                        </div>

                    </div>

                `;

            }
        ).join("");


    container
        .querySelectorAll("[data-upgrade]")
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        buyUpgrade(
                            element.dataset.upgrade
                        );

                    }
                );

            }
        );

}


function buyUpgrade(id){

    const item =
        upgrades.find(
            x => x.id === id
        );


    if(!item){
        return;
    }


    const s = state();


    if(
        s.player.money <
        item.cost
    ){

        TelegramAPI.haptic(
            "error"
        );

        return;
    }


    s.player.money -=
        item.cost;


    s.player.totalSpent +=
        item.cost;


    s.upgrades[id] =
        Number(
            s.upgrades[id] || 0
        ) + 1;


    s.economy.incomePerSecond +=
        item.income;


    save();

    TelegramAPI.haptic(
        "success"
    );

    render();

}


function tap(event){

    const s = state();


    /*
     * Главная кнопка игры.
     * Каждый тап = +1 €.
     */

    const amount = 1;


    s.player.money +=
        amount;


    s.player.totalEarned +=
        amount;


    s.player.xp +=
        1;


    if(
        s.player.xp >=
        s.player.level * 100
    ){

        s.player.xp = 0;

        s.player.level += 1;

    }


    /*
     * Небольшой расход энергии.
     */

    s.player.energy =
        Math.max(
            0,
            s.player.energy - 0.1
        );


    save();

    render();


    TelegramAPI.haptic(
        "light"
    );


    showPopup(
        event,
        "+1 €"
    );

}


function claimIncome(){

    const s = state();


    const amount =
        Math.max(
            0,
            s.player.energy
        ) * 0.1;


    if(amount <= 0){

        TelegramAPI.haptic(
            "error"
        );

        return;

    }


    s.player.money +=
        amount;


    s.player.totalEarned +=
        amount;


    s.player.energy = 0;


    save();

    render();


    TelegramAPI.haptic(
        "success"
    );

}


function showPopup(
    event,
    text
){

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "popup";


    popup.textContent =
        text;


    popup.style.left =
        (
            event.clientX - 10
        ) + "px";


    popup.style.top =
        (
            event.clientY - 25
        ) + "px";


    document.body.appendChild(
        popup
    );


    setTimeout(
        () => popup.remove(),
        600
    );

}


document
    .getElementById("tapButton")
    .addEventListener(
        "click",
        tap
    );


document
    .getElementById("donationButton")
    .addEventListener(
        "click",
        claimIncome
    );


document.addEventListener(
    "game:render",
    render
);


document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
         * Старт новой игровой системы.
         */

        Game.start();

        render();

    }
);


render();

})();

</script>

</body>
</html>
