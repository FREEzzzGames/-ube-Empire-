<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Студия</title>
<script src="core.js"></script>
<style>
:root, [data-theme="dark"] {
  --portal-bg: rgba(20, 10, 10, 0.96);
  --border-col: rgba(255, 0, 0, 0.4);
  --accent-col: #ff0000;
  --title-col: #ffcc00;
  --btn-bg: rgba(40, 15, 15, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.03);
  --housing-col: #3498db;
  --text-main: #fff;
  --text-sub: #ff8888;
  --body-bg: #0a0505;
}
[data-theme="rose"] {
  --portal-bg: rgba(30, 10, 25, 0.96);
  --border-col: rgba(233, 30, 99, 0.5);
  --accent-col: #e91e63;
  --title-col: #ffeb3b;
  --btn-bg: rgba(60, 15, 40, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.03);
  --housing-col: #ff4081;
  --text-main: #fff;
  --text-sub: #ff80ab;
  --body-bg: #150510;
}
[data-theme="light"] {
  --portal-bg: rgba(245, 247, 250, 0.96);
  --border-col: rgba(211, 47, 47, 0.4);
  --accent-col: #d32f2f;
  --title-col: #e65100;
  --btn-bg: rgba(255, 255, 255, 0.9);
  --glass-bg: rgba(230, 235, 245, 0.85);
  --housing-col: #0288d1;
  --text-main: #1a1a1a;
  --text-sub: #555555;
  --body-bg: #e0e4ec;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--body-bg);color:var(--text-main);font-family:monospace;overflow:hidden;transition:background 0.3s;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 6px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 14px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
  position: relative;
}

.game-ui-header { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 4px 6px; background: var(--btn-bg); border: 1px solid var(--border-col); 
  border-radius: 6px; width: 100%; flex-shrink: 0; font-size: 9.5px; 
}
.header-left { display: flex; gap: 2px; align-items: center; }

.back-btn {
  background: rgba(217, 30, 30, 0.85); border: 1px solid #ff4d4d; color: #fff;
  padding: 2px 4px; border-radius: 4px; text-decoration: none; font-weight: bold;
  cursor: pointer; font-size: 7px;
}
.back-btn:active { transform: scale(0.95); }

.shop-link-btn, .gallery-link-btn, .rank-link-btn, .lang-btn {
  background: var(--glass-bg); border: 1px solid var(--accent-col); color: var(--text-main);
  padding: 2px 4px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 8px;
  text-decoration: none; display: flex; align-items: center; justify-content: center;
}

.clicker-body {
  flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 2px 0; width: 100%; gap: 4px; overflow: hidden;
}

.resources-container { display: flex; gap: 4px; width: 100%; }
.res-box {
  flex: 1; background: var(--glass-bg); border: 1px solid var(--border-col); border-radius: 6px;
  padding: 4px; text-align: center;
}
.res-title { font-size: 7px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; }
.res-val { font-size: 14px; font-weight: bold; color: var(--title-col); text-shadow: 0 0 6px rgba(255,204,0,0.4); margin-top: 1px; }
.res-sub { font-size: 7px; color: var(--text-sub); margin-top: 1px; }

@keyframes redSpark {
  0% { text-shadow: 0 0 4px #ff0000, 0 0 8px #ff0000; color: var(--text-main); }
  50% { text-shadow: 0 0 10px var(--accent-col), 0 0 18px #ff0000; color: var(--accent-col); }
  100% { text-shadow: 0 0 4px #ff0000, 0 0 8px #ff0000; color: var(--text-main); }
}
.views-pulse { animation: redSpark 1.2s infinite ease-in-out; }

.money-pipe {
  width: 100%; height: 6px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-col);
  border-radius: 3px; position: relative; overflow: hidden;
}
.money-flow {
  position: absolute; top: 0; left: -100%; width: 200%; height: 100%;
  background: repeating-linear-gradient(90deg, transparent, transparent 6px, var(--title-col) 6px, var(--title-col) 12px, var(--text-main) 12px, var(--text-main) 16px);
  opacity: 0.75; animation: flowMoney 1.5s linear infinite;
}
@keyframes flowMoney { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }

.sell-energy-btn {
  width: 100%; background: var(--btn-bg);
  border: 1px solid var(--title-col); border-radius: 6px; padding: 5px; color: var(--title-col);
  font-family: monospace; font-size: 9px; font-weight: bold; cursor: pointer; text-align: center;
  box-shadow: 0 0 5px rgba(255,204,0,0.15);
}
.sell-energy-btn:active { transform: scale(0.97); }

.progress-bar-container { width: 100%; height: 2px; background: rgba(0,0,0,0.1); border-radius: 2px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-col), var(--title-col)); width: 0%; transition: width 0.2s ease; }

.click-target-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; margin: 0; }
.click-target {
  width: 62px; height: 62px; background: radial-gradient(circle at 35% 35%, var(--accent-col), #800000);
  border: 2.5px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center;
  font-size: 26px; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.4); transition: transform 0.08s ease;
  user-select: none; touch-action: manipulation;
}
.click-target:active { transform: scale(0.88); }

.upgrades-list { 
  width: 100%; display: flex; flex-direction: column; gap: 4px; 
  max-height: 190px; overflow-y: auto; padding-right: 2px; 
}
.upgrade-card {
  display: flex; justify-content: space-between; align-items: center; background: var(--btn-bg);
  border: 1px solid var(--border-col); border-radius: 6px; padding: 5px 8px; font-size: 9.5px; text-align: left; cursor: pointer;
  transition: all 0.12s ease; min-height: 40px;
}
.upgrade-card:active { transform: scale(0.98); }
.upgrade-info { display: flex; flex-direction: column; gap: 1px; }
.upgrade-name { color: var(--title-col); font-weight: bold; font-size: 9.5px; }
.upgrade-desc { font-size: 7px; color: var(--text-sub); }
.upgrade-cost { color: var(--accent-col); font-weight: bold; font-size: 8px; }
.upgrade-count { font-size: 10px; font-weight: bold; color: var(--text-main); background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border-col); }
.upgrade-card.housing { border-color: var(--housing-col); }
.upgrade-card.housing .upgrade-name { color: var(--housing-col); }

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-30px) scale(1.15); opacity: 0; }
}
.floating-text {
  position: fixed; color: var(--title-col); font-size: 13px; font-weight: bold; pointer-events: none; z-index: 99999;
  animation: floatUp 0.35s ease-out forwards; text-shadow: 0 0 4px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div class="portal">
  <div class="game-ui-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" id="menuBtnTxt">⬅ МЕНЮ</a>
      <a href="collection.html" class="shop-link-btn" id="shopBtnTxt">🛒 Магазин</a>
      <a href="gallery.html" class="gallery-link-btn" id="galleryBtnTxt">🏆 Награды</a>
      <a href="leaderboard.html" class="rank-link-btn" id="rankBtnTxt">📊 Топ</a>
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">🇷🇺 RU</button>
    </div>
  </div>

  <div class="clicker-body">
    <div class="resources-container">
      <div class="res-box">
        <div class="res-title" id="resBudgetTitle">Баланс (€)</div>
        <div class="res-val" id="moneyTxt">0.00 €</div>
        <div class="res-sub" id="cpsTxt">+0.0 €/сек</div>
      </div>
      <div class="res-box">
        <div class="res-title" id="resEnergyTitle">Просмотры (Mio)</div>
        <div class="res-val views-pulse" id="energyTxt">0.0M</div>
        <div class="res-sub" id="housingSubTxt">ПК-места: 0/0</div>
      </div>
    </div>

    <div class="money-pipe"><div class="money-flow" id="moneyFlow"></div></div>
    <button class="sell-energy-btn" id="sellBtnTxt" onclick="sellEnergy()">💰 ВЫВЕСТИ ADDSENSE (1M = 2.50 €)</button>
    <div class="progress-bar-container"><div class="progress-bar-fill" id="progressFill"></div></div>

    <div class="click-target-container">
      <div class="click-target" onclick="clickEnergy(event)">🔴</div>
      <div style="font-size: 7px; color: var(--text-sub);" id="tapHintTxt">Тапай для записи ролика!</div>
    </div>

    <div class="upgrades-list" id="upgradesList"></div>
  </div>
</div>

<script>
const langData = {
  ru: {
    menu: "⬅ МЕНЮ", shop: "🛒 Магазин", gallery: "🏆 Награды", rank: "📊 Топ",
    budget: "Баланс (€)", energy: "Просмотры (Mio)",
    sellBtn: "💰 ВЫВЕСТИ ADDSENSE (1M = 2.50 €)", tapHint: "Тапай для записи ролика!",
    price: "Цена", noSlots: "❌ Нет свободных рабочих мест!",
    items: [
      { name: "💻 Стол для монтажа", desc: "+3 рабочих места в студии", type: "housing" },
      { name: "🏢 Офис-студия блогеров", desc: "+10 рабочих мест в студии", type: "housing" },
      { name: "🧑‍💻 Начинающий клипмейкер", desc: "Авто-монтаж (требует ПК)", type: "worker" },
      { name: "🎥 Сценарист / Оператор", desc: "Профи контента (требует ПК)", type: "worker" },
      { name: "🎬 Продюсерская команда", desc: "Медиа-мастера (требует ПК)", type: "worker" },
      { name: "🤖 Бот для Shorts/Reels", desc: "Авто-генерация роликов", type: "station" },
      { name: "🎙️ Студия подкастов", desc: "Стрим-ферма (+ просмотры)", type: "station" },
      { name: "🌐 Топовая MCN-сеть", desc: "Максимальные просмотры и доход", type: "station" }
    ]
  },
  de: {
    menu: "⬅ MENÜ", shop: "🛒 Shop", gallery: "🏆 Trophäen", rank: "📊 Top",
    budget: "Guthaben (€)", energy: "Aufrufe (Mio)",
    sellBtn: "💰 ADDSENSE AUSZAHLEN (1M = 2.50 €)", tapHint: "Tippen für Video-Upload!",
    price: "Preis", noSlots: "❌ Keine Arbeitsplätze frei!",
    items: [
      { name: "💻 Schnittplatz", desc: "+3 Plätze im Studio", type: "housing" },
      { name: "🏢 Blogger-Studiobüro", desc: "+10 Plätze im Studio", type: "housing" },
      { name: "🧑‍💻 Junior Editor", desc: "Auto-Editing (braucht Platz)", type: "worker" },
      { name: "🎥 Kameramann / Autor", desc: "Content-Profi (braucht Platz)", type: "worker" },
      { name: "🎬 Produzenten-Team", desc: "Medienmeister (braucht Platz)", type: "worker" },
      { name: "🤖 Shorts/Reels Bot", desc: "Auto-Videogenerator", type: "station" },
      { name: "🎙️ Podcast Studio", desc: "Stream-Farm (+ Aufrufe)", type: "station" },
      { name: "🌐 Top MCN-Netzwerk", desc: "Maximale Aufrufe & Ertrag", type: "station" }
    ]
  },
  en: {
    menu: "⬅ MENU", shop: "🛒 Shop", gallery: "🏆 Awards", rank: "📊 Top",
    budget: "Balance (€)", energy: "Views (Mio)",
    sellBtn: "💰 CASHOUT ADDSENSE (1M = 2.50 €)", tapHint: "Tap to record video!",
    price: "Price", noSlots: "❌ No free workspaces!",
    items: [
      { name: "💻 Editing Desk", desc: "+3 studio workspaces", type: "housing" },
      { name: "🏢 Blogger Studio Office", desc: "+10 studio workspaces", type: "housing" },
      { name: "🧑‍💻 Junior Video Editor", desc: "Auto-editing (needs workspace)", type: "worker" },
      { name: "🎥 Scriptwriter / Cameraman", desc: "Content pro (needs workspace)", type: "worker" },
      { name: "🎬 Producer Team", desc: "Media masters (needs workspace)", type: "worker" },
      { name: "🤖 Shorts/Reels Bot", desc: "Auto-video generator", type: "station" },
      { name: "🎙️ Podcast Studio", desc: "Stream farm (+ views)", type: "station" },
      { name: "🌐 Top MCN Network", desc: "Maximum views & earnings", type: "station" }
    ]
  }
};

function toggleLanguage() {
  Core.toggleLang();
  updateLanguageUI();
  updateUI();
}

function updateLanguageUI() {
  let lang = Core.getLang();
  let t = langData[lang];
  document.getElementById('menuBtnTxt').textContent = t.menu;
  document.getElementById('shopBtnTxt').textContent = t.shop;
  document.getElementById('galleryBtnTxt').textContent = t.gallery;
  document.getElementById('rankBtnTxt').textContent = t.rank;
  document.getElementById('resBudgetTitle').textContent = t.budget;
  document.getElementById('resEnergyTitle').textContent = t.energy;
  document.getElementById('sellBtnTxt').textContent = t.sellBtn;
  document.getElementById('tapHintTxt').textContent = t.tapHint;
  
  let langLabels = { ru: "🇷🇺 RU", de: "🇩🇪 DE", en: "🇬🇧 EN" };
  document.getElementById('langBtn').textContent = langLabels[lang];
}

let upgrades = [
  { id: 'wagon', cost: 100, housingSlots: 3, count: Number(localStorage.getItem("up_wagon") || 0), mult: 1.25, type: 'housing' },
  { id: 'dorm', cost: 800, housingSlots: 10, count: Number(localStorage.getItem("up_dorm") || 0), mult: 1.30, type: 'housing' },
  { id: 'azubi', cost: 25, incomeEur: 0.1, energyMWh: 0.05, count: Number(localStorage.getItem("up_azubi") || 0), mult: 1.12, type: 'worker' },
  { id: 'elektrik', cost: 150, incomeEur: 0.4, energyMWh: 0.1, count: Number(localStorage.getItem("up_elektrik") || 0), mult: 1.15, type: 'worker' },
  { id: 'brigade', cost: 1200, incomeEur: 2, energyMWh: 0.8, count: Number(localStorage.getItem("up_brigade") || 0), mult: 1.18, type: 'worker' },
  { id: 'wind', cost: 9500, incomeEur: 14, energyMWh: 8.5, workersNeeded: 2, count: Number(localStorage.getItem("up_wind") || 0), mult: 1.20, type: 'station' },
  { id: 'solar', cost: 120000, incomeEur: 110, energyMWh: 65, workersNeeded: 8, count: Number(localStorage.getItem("up_solar") || 0), mult: 1.22, type: 'station' },
  { id: 'aes', cost: 1500000, incomeEur: 850, energyMWh: 450, workersNeeded: 30, count: Number(localStorage.getItem("up_aes") || 0), mult: 1.25, type: 'station' }
];

function getHousingStats() {
  let totalSlots = 0, usedSlots = 0;
  upgrades.forEach(up => {
    if (up.type === 'housing') totalSlots += up.count * up.housingSlots;
    if (up.type === 'worker') usedSlots += up.count;
  });
  return { totalSlots, usedSlots };
}

function clickEnergy(e) {
  let money = Core.getMoney() + 1;
  let energy = Core.getEnergy() + 0.2;
  Core.setMoney(money);
  Core.setEnergy(energy);

  Core.playSound(520, 'triangle', 0.08);
  Core.haptic('light');
  updateUI();

  let pop = document.createElement('div');
  pop.textContent = "+1 € / 🔴"; pop.className = "floating-text";
  pop.style.left = (e.clientX - 15) + "px"; pop.style.top = (e.clientY - 25) + "px";
  document.body.appendChild(pop); setTimeout(() => pop.remove(), 350);
}

function sellEnergy() {
  let energy = Core.getEnergy();
  if (energy < 1) { Core.playSound(150, 'sawtooth', 0.15); return; }
  let earned = energy * 2.50;
  let money = Core.getMoney() + earned;
  Core.setMoney(money);
  Core.setEnergy(0);

  Core.playSound(880, 'square', 0.2);
  Core.haptic('heavy');
  updateUI();
}

function buyUpgrade(index) {
  let up = upgrades[index], housing = getHousingStats();
  if (up.type === 'worker' && (housing.totalSlots - housing.usedSlots) <= 0) {
    Core.playSound(120, 'sawtooth', 0.2); Core.haptic('heavy'); return;
  }
  let money = Core.getMoney();
  if (money >= up.cost) {
    money -= up.cost;
    Core.setMoney(money);
    up.count++;
    up.cost = Math.floor(up.cost * up.mult);
    localStorage.setItem("up_" + up.id, up.count);
    Core.playSound(720, 'square', 0.15);
    Core.haptic('medium');
    updateUI();
  } else {
    Core.playSound(140, 'sawtooth', 0.2);
  }
}

function calculateStats() {
  let totalEurSec = 0, totalEnergySec = 0, housing = getHousingStats();
  upgrades.forEach(up => {
    if (up.type === 'worker') {
      totalEurSec += up.incomeEur * up.count; totalEnergySec += up.energyMWh * up.count;
    } else if (up.type === 'station') {
      let req = (up.workersNeeded || 0) * up.count;
      let eff = req > 0 ? Math.min(1.0, housing.usedSlots / req) : 1.0;
      if (housing.usedSlots === 0 && req > 0) eff = 0.1;
      totalEurSec += (up.incomeEur * up.count) * eff;
      totalEnergySec += (up.energyMWh * up.count) * eff;
    }
  });
  return { totalEurSec, totalEnergySec };
}

function updateUI() {
  let stats = calculateStats(), housing = getHousingStats();
  let lang = Core.getLang();
  let t = langData[lang];
  let money = Core.getMoney();
  let energy = Core.getEnergy();

  document.getElementById('moneyTxt').textContent = money.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
  document.getElementById('cpsTxt').textContent = `+${stats.totalEurSec.toFixed(1)} €/s`;
  document.getElementById('energyTxt').textContent = energy.toFixed(1) + (lang === 'ru' ? "M" : (lang === 'de' ? " Mio" : "M"));
  document.getElementById('housingSubTxt').textContent = `PC: ${housing.usedSlots}/${housing.totalSlots}`;

  let cheapestCost = Math.min(...upgrades.map(u => u.cost));
  document.getElementById('progressFill').style.width = Math.min(100, (money / cheapestCost) * 100) + "%";

  let listHtml = "";
  upgrades.forEach((up, idx) => {
    let currentCost = Math.floor(up.cost), canBuy = money >= currentCost, localizedItem = t.items[idx];
    let subInfo = localizedItem.desc;
    if (up.type === 'worker') {
      let freeSlots = housing.totalSlots - housing.usedSlots;
      canBuy = canBuy && freeSlots > 0;
      subInfo = freeSlots > 0 ? `+${up.incomeEur}€/s, +${up.energyMWh}M/s` : `<span style="color:#e74c3c">${t.noSlots}</span>`;
    }
    listHtml += `
      <div class="upgrade-card ${up.type === 'housing' ? 'housing' : ''}" style="opacity: ${canBuy ? 1 : 0.6};" onclick="buyUpgrade(${idx})">
        <div class="upgrade-info">
          <div class="upgrade-name">${localizedItem.name}</div>
          <div class="upgrade-desc">${subInfo}</div>
          <div class="upgrade-cost">${t.price}: ${currentCost.toLocaleString()} €</div>
        </div>
        <div class="upgrade-count">${up.count}</div>
      </div>
    `;
  });
  document.getElementById('upgradesList').innerHTML = listHtml;
}

setInterval(() => {
  let stats = calculateStats();
  if (stats.totalEurSec > 0 || stats.totalEnergySec > 0) {
    let money = Core.getMoney() + (stats.totalEurSec / 10);
    let energy = Core.getEnergy() + (stats.totalEnergySec / 10);
    Core.setMoney(money);
    Core.setEnergy(energy);
    updateUI();
  }
}, 100);

updateLanguageUI();
updateUI();
</script>
</body>
</html>
