<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Game</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#090b12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.game{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:16px;
    background:
        radial-gradient(circle at 50% 20%,#20284b 0,#101525 35%,#090b12 75%);
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:.5px;
}

.status{
    padding:7px 10px;
    border-radius:10px;
    background:#171c2c;
    color:#8df5b0;
    font-size:12px;
    font-weight:bold;
}

.balance{
    background:linear-gradient(145deg,#171d32,#0d111d);
    border:1px solid #303b60;
    border-radius:18px;
    padding:18px;
    text-align:center;
    box-shadow:0 10px 30px #0008;
}

.balance-title{
    color:#8993ad;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.money{
    margin-top:5px;
    font-size:38px;
    font-weight:900;
    color:#72f7a0;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.stat{
    background:#111624;
    border:1px solid #252e47;
    border-radius:14px;
    padding:13px;
}

.stat-label{
    color:#78829b;
    font-size:11px;
    text-transform:uppercase;
}

.stat-value{
    margin-top:5px;
    font-size:20px;
    font-weight:800;
}

.game-card{
    margin-top:14px;
    background:#101522;
    border:1px solid #29334f;
    border-radius:22px;
    padding:20px;
    text-align:center;
}

.game-title{
    font-size:20px;
    font-weight:900;
}

.game-subtitle{
    margin-top:6px;
    color:#858fa8;
    font-size:13px;
}

.tap-area{
    margin:25px auto 18px;
    width:220px;
    height:220px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#242f59 0,#151d38 48%,#0d1221 70%);
    border:4px solid #536aa8;
    box-shadow:
        0 0 25px #4668bd88,
        inset 0 0 35px #000;
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    transition:.08s;
}

.tap-area:active{
    transform:scale(.94);
    border-color:#7b9cff;
    box-shadow:
        0 0 45px #557cffaa,
        inset 0 0 35px #000;
}

.tap-icon{
    font-size:70px;
}

.tap-text{
    margin-top:10px;
    font-size:13px;
    color:#aeb9d5;
    font-weight:bold;
}

.energy{
    margin-top:12px;
}

.energy-head{
    display:flex;
    justify-content:space-between;
    color:#8b96ae;
    font-size:12px;
    margin-bottom:6px;
}

.energy-bar{
    height:10px;
    background:#080b12;
    border-radius:20px;
    overflow:hidden;
}

.energy-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#58d9ff,#8d7cff);
    border-radius:20px;
    transition:.2s;
}

    margin-top:10px;
    color:#77eaff;
    font-size
