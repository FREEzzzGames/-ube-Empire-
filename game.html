<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Tube Empire — Studio</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070305;
    color:#fff;
    font-family:system-ui,sans-serif;
}

body{
    padding:4px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.portal{
    width:100%;
    max-width:420px;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #190c12,
            #080407
        );

    border:2px solid rgba(255,50,80,.35);
    border-radius:18px;
}

.header{
    display:flex;
    gap:5px;
    padding:6px;
    border:1px solid rgba(255,50,80,.35);
    border-radius:10px;
    background:#16090e;
}

.header a{
    flex:1;
    text-align:center;
    text-decoration:none;
    color:#fff;
    padding:7px 4px;
    border-radius:7px;
    background:#241018;
    border:1px solid rgba(255,255,255,.12);
    font-size:9px;
    font-weight:800;
}

.header a:first-child{
    background:#d90429;
}

.body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-top:8px;
}

.stats{
    display:flex;
    gap:6px;
}

.stat{
    flex:1;
    padding:8px;
    text-align:center;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    background:rgba(255,255,255,.025);
}

.label{
    color:#ff94a8;
    font-size:8px;
    font-weight:800;
}

.value{
    color:#ffd700;
    font-size:16px;
    font-weight:900;
    margin-top:3px;
}

.small{
    color:#ff94a8;
    font-size:8px;
    margin-top:2px;
}

.trend{
    display:flex;
    justify-content:space-between;
    padding:7px 10px;
    border:1px dashed rgba(255,215,0,.3);
    border-radius:9px;
    background:rgba(255,215,0,.04);
    font-size:9px;
}

.studio{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid rgba(255,50,80,.35);
    border-radius:12px;
    background:
        radial-gradient(
            circle,
            #32101c,
            #0b0407
        );
    font-size:28px;
}

.donation{
    width:100%;
    padding:8px;
    border:1px solid #ffd700;
    border-radius:8px;
    background:#3a121d;
    color:#ffd700;
    font-size:9px;
    font-weight:900;
}

.tap-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:3px;
}

.tap-button{
    width:82px;
    height:82px;

    border-radius:50%;
    border:4px solid #fff;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff718b,
            #ff174f 45%,
            #72001e
        );

    box-shadow:
        0 0 20px rgba(255,30,90,.6),
        inset 0 0 15px rgba(255,255,255,.2);

    color:#fff;
    font-size:26px;
    font-weight:900;

    cursor:pointer;
    touch-action:manipulation;
    user-select:none;

    transition:
        transform .08s,
        box-shadow .08s;
}

.tap-button:active{
    transform:scale(.88);
    box-shadow:
        0 0 35px rgba(255,30,90,.9);
}

.status{
    text-align:center;
    min-height:18px;
    color:#72ffb0;
    font-size:9px;
    font-weight:800;
}

.list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.card{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:8px 10px;

    border:1px solid rgba(255,50,80,.35);
    border-radius:9px;

    background:#180a10;

    cursor:pointer;
}

.card-name{
    color:#ffd700;
    font-size:9px;
    font-weight:800;
}

.card-desc{
    color:#ff94a8;
    font-size:7px;
    margin-top:2px;
}

.card-count{
    color:#fff;
    background:#0006;
    padding:4px 7px;
    border-radius:6px;
    font-size:10px;
    font-weight:900;
}

.popup{
    position:fixed;
    z-index:9999;
    pointer-events:none;

    color:#ffd700;
    font-size:14px;
    font-weight:900;

    animation:
        popup .55s ease-out forwards;
}

@keyframes popup{

    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    100%{
        opacity:0;
        transform:translateY(-35px) scale(1.15);
    }

}

</style>

</head>

<body>

<div class="portal">

    <div class="header">

        <a href="index.html">
            ⬅ МЕНЮ
        </a>

        <a href="collection.html">
            🛒 МАГАЗИН
        </a>

        <a href="avatar.html">
            🎨 СТУДИЯ
        </a>

    </div>


    <div class="body">


        <div class="stats">

            <div class="stat">

                <div class="label">
                    БАЛАНС
                </div>

                <div
                    class="value"
                    id="money"
                >
                    1000.00 €
                </div>

                <div
                    class="small"
                    id="income"
                >
                    +0.0 €/с
                </div>

            </div>


            <div class="stat">

                <div class="label">
                    ЭНЕРГИЯ
                </div>

                <div
                    class="value"
                    id="energy"
                >
                    100.0
                </div>

                <div
                    class="small"
                >
                    Энергия
                </div>

            </div>

        </div>


        <div class="trend">

            <span>
                🔥 ТРЕНД
            </span>

            <span>
                x1.00
            </span>

        </div>


        <div class="studio">
            🎙️ 💻 💡
        </div>


        <button
            class="donation"
            id="donationButton"
            type="button"
        >
            🎁 ЗАБРАТЬ ДОХОД
        </button>


        <div class="tap-area">

            <button
                class="tap-button"
                id="tapButton"
                type="button"
            >
                ▶
            </button>

        </div>


        <div
            class="status"
            id="status"
        >
            ИГРА ГОТОВА
        </div>


        <div
            class="list"
            id="upgradeList"
        ></div>


    </div>

</div>


<script>

"use strict";


/*
==================================================
 TUBE EMPIRE
 ПРОСТАЯ РАБОЧАЯ СИСТЕМА
==================================================
*/


const STORAGE_KEY =
    "tube_empire_simple_game_v1";


let game = {

    money:1000,

    energy:100,

    income:0,

    totalEarned:0,

    totalSpent:0,

    upgrades:{

        desk:0,

        office:0,

        clipmaker:0,

        camera:0

    }

};


/*
==================================================
 ЗАГРУЗКА
==================================================
*/

function loadGame(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(saved){

            const parsed =
                JSON.parse(saved);


            if(
                parsed &&
                typeof parsed === "object"
            ){

                game = {
                    ...game,
                    ...parsed
                };

            }

        }

    }catch(error){

        console.error(
            "Ошибка загрузки:",
            error
        );

    }

}


/*
==================================================
 СОХРАНЕНИЕ
==================================================
*/

function saveGame(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(game)
        );

    }catch(error){

        console.error(
            "Ошибка сохранения:",
            error
        );

    }

}


/*
==================================================
 ФОРМАТ ДЕНЕГ
==================================================
*/

function moneyText(value){

    return Number(
        value
    ).toLocaleString(
        "ru-RU",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " €";

}


/*
==================================================
 ОБНОВЛЕНИЕ ЭКРАНА
==================================================
*/

function render(){

    document.getElementById(
        "money"
    ).textContent =
        moneyText(
            game.money
        );


    document.getElementById(
        "energy"
    ).textContent =
        Number(
            game.energy
        ).toFixed(1);


    document.getElementById(
        "income"
    ).textContent =
        "+" +
        Number(
            game.income
        ).toFixed(1) +
        " €/с";


    renderUpgrades();

}


/*
==================================================
 УЛУЧШЕНИЯ
==================================================
*/

const upgrades = [

    {
        id:"desk",
        name:"💻 Стол монтажа",
        description:"+1 €/с",
        cost:100,
        income:1
    },

    {
        id:"office",
        name:"🏢 Офис",
        description:"+5 €/с",
        cost:500,
        income:5
    },

    {
        id:"clipmaker",
        name:"🧑‍💻 Клипмейкер",
        description:"+15 €/с",
        cost:1500,
        income:15
    },

    {
        id:"camera",
        name:"🎥 Оператор",
        description:"+50 €/с",
        cost:5000,
        income:50
    }

];


function renderUpgrades(){

    const container =
        document.getElementById(
            "upgradeList"
        );


    container.innerHTML = "";


    upgrades.forEach(
        item => {

            const count =
                Number(
                    game.upgrades[
                        item.id
                    ] || 0
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <div>

                    <div class="card-name">
                        ${item.name}
                    </div>

                    <div class="card-desc">
                        ${item.description}
                        ·
                        ${item.cost.toLocaleString("ru-RU")} €
                    </div>

                </div>

                <div class="card-count">
                    ${count}
                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    buyUpgrade(
                        item
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );

}


/*
==================================================
 ПОКУПКА
==================================================
*/

function buyUpgrade(item){

    if(
        game.money <
        item.cost
    ){

        setStatus(
            "❌ НЕДОСТАТОЧНО ДЕНЕГ"
        );

        return;

    }


    game.money -=
        item.cost;


    game.totalSpent +=
        item.cost;


    game.upgrades[
        item.id
    ] =
        Number(
            game.upgrades[
                item.id
            ] || 0
        ) + 1;


    game.income +=
        item.income;


    saveGame();

    render();


    setStatus(
        "✅ УЛУЧШЕНИЕ КУПЛЕНО"
    );

}


/*
==================================================
 ГЛАВНАЯ КНОПКА
==================================================
*/

function tapGame(event){

    console.log(
        "TAP WORKS"
    );


    /*
     * ГЛАВНОЕ:
     * деньги увеличиваются
     * непосредственно здесь.
     */

    game.money =
        Number(game.money) + 1;


    game.totalEarned =
        Number(game.totalEarned) + 1;


    game.energy =
        Math.max(
            0,
            Number(game.energy) - 0.1
        );


    saveGame();

    render();


    setStatus(
        "✅ +1 €"
    );


    showPopup(
        event,
        "+1 €"
    );

}


/*
==================================================
 ДОХОД
==================================================
*/

function claimIncome(){

    const amount =
        Number(game.energy) * 0.1;


    if(amount <= 0){

        setStatus(
            "❌ НЕТ ЭНЕРГИИ"
        );

        return;

    }


    game.money +=
        amount;


    game.totalEarned +=
        amount;


    game.energy = 0;


    saveGame();

    render();


    setStatus(
        "✅ ДОХОД ПОЛУЧЕН"
    );

}


/*
==================================================
 ВСПЛЫВАЮЩИЙ +1 €
==================================================
*/

function showPopup(
    event,
    text
){

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "popup";


    popup.textContent =
        text;


    let x =
        window.innerWidth / 2;


    let y =
        window.innerHeight / 2;


    if(event){

        x =
            event.clientX;


        y =
            event.clientY;

    }


    popup.style.left =
        (x - 15) + "px";


    popup.style.top =
        (y - 25) + "px";


    document.body.appendChild(
        popup
    );


    setTimeout(
        function(){

            popup.remove();

        },
        600
    );

}


/*
==================================================
 СТАТУС
==================================================
*/

function setStatus(text){

    document.getElementById(
        "status"
    ).textContent =
        text;

}


/*
==================================================
 СОБЫТИЯ КНОПОК
==================================================
*/

const tapButton =
    document.getElementById(
        "tapButton"
    );


tapButton.addEventListener(
    "click",
    tapGame
);


tapButton.addEventListener(
    "touchend",
    function(event){

        event.preventDefault();

        tapGame(event);

    },
    {
        passive:false
    }
);


document
    .getElementById(
        "donationButton"
    )
    .addEventListener(
        "click",
        claimIncome
    );


/*
==================================================
 АВТОДОХОД
==================================================
*/

setInterval(
    function(){

        if(
            game.income > 0
        ){

            const amount =
                Number(
                    game.income
                ) / 10;


            game.money +=
                amount;


            game.totalEarned +=
                amount;


            saveGame();

            render();

        }

    },
    100
);


/*
==================================================
 СТАРТ
==================================================
*/

loadGame();

render();

setStatus(
    "ИГРА ГОТОВА — НАЖМИ ▶"
);


console.log(
    "Tube Empire loaded"
);


console.log(
    "Current money:",
    game.money
);

</script>

</body>
</html>
