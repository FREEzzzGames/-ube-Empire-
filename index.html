<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube Empire — Главное меню</title><script src="core.js"></script>
<style>
:root{
  --bg:#070305;
  --p-bg:linear-gradient(135deg, rgba(25,12,18,0.95), rgba(10,5,8,0.98));
  --b-col:rgba(255,50,80,0.35);
  --acc:#ff2a5f;
  --acc-glow:rgba(255,42,95,0.6);
  --t-col:#ffd700;
  --btn:linear-gradient(145deg, #221016, #14080b);
  --txt:#fff;
  --sub:#ff94a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
body{padding:4px;display:flex;justify-content:center;align-items:center;position:fixed;inset:0;}

.portal{
  width:100%;height:100%;max-width:420px;max-height:100vh;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:14px;background:var(--p-bg);border:2px solid var(--b-col);
  border-radius:18px;box-shadow:0 0 30px rgba(255,42,95,0.15), inset 0 0 20px rgba(0,0,0,0.8);
  position:relative;backdrop-filter:blur(10px);text-align:center;
}

.top-bar{display:flex;justify-content:flex-end;gap:6px;}
.top-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--txt);padding:4px 8px;border-radius:6px;font-size:9px;font-weight:600;cursor:pointer;}

.logo-container{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0;}
.logo-icon{
  width:64px;height:64px;background:radial-gradient(circle at 35% 35%, #ff4d6d 0%, #d90429 55%, #800020 100%);
  border:3px solid #fff;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:28px;
  box-shadow:0 0 25px var(--acc-glow), 0 6px 15px rgba(0,0,0,0.6);
}
.game-title{font-size:22px;font-weight:900;color:var(--t-col);text-shadow:0 0 12px rgba(255,215,0,0.4);letter-spacing:1px;margin:0;}
.game-subtitle{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;margin:0;}

/* Карточка профиля / игрока */
.profile-card{
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:12px;
  padding:10px;display:flex;align-items:center;gap:10px;text-align:left;
  box-shadow:inset 0 2px 5px rgba(0,0,0,0.5);
}
.avatar-box{
  width:42px;height:42px;background:var(--btn);border:1px solid var(--b-col);border-radius:8px;
  display:flex;justify-content:center;align-items:center;font-size:20px;flex-shrink:0;
}
.profile-info{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.profile-name{font-size:11px;font-weight:800;color:var(--t-col);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.profile-stats{font-size:8px;color:var(--sub);}

/* Меню навигации */
.menu-nav{display:flex;flex-direction:column;gap:7px;margin:5px 0;}
.menu-btn{
  background:linear-gradient(145deg, #221016, #14080b);border:1px solid var(--b-col);border-radius:12px;
  padding:11px 14px;color:var(--txt);font-size:12px;font-weight:800;text-decoration:none;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);transition:all 0.15s ease;
}
.menu-btn:hover, .menu-btn:active{border-color:var(--acc);transform:scale(0.98);background:linear-gradient(145deg, #2d141c, #190a0f);}
.menu-btn.primary{
  background:linear-gradient(135deg, #ff2a5f, #d90429);border-color:#ff7597;color:#fff;
  box-shadow:0 0 20px rgba(255,42,95,0.4), 0 4px 12px rgba(0,0,0,0.4);font-size:13px;
}

.footer-info{font-size:7.5px;color:var(--sub);opacity:0.7;margin-top:5px;}
</style>
</head>
<body>
<div class="portal">
  <div class="top-bar">
    <button class="top-btn" onclick="Core.toggleTheme(); updateUI();" id="themeBtn">🎨 ТЕМА</button>
    <button class="top-btn" onclick="Core.toggleSound(); updateUI();" id="soundBtn">🔊 ЗВУК</button>
    <button class="top-btn" onclick="Core.toggleLang(); updateUI();" id="langBtn">🇷🇺 RU</button>
  </div>

  <div class="logo-container">
    <div class="logo-icon">📺</div>
    <h1 class="game-title">TUBE EMPIRE</h1>
    <p class="game-subtitle" id="subTitle">Idle Streamer Tycoon</p>
  </div>

  <div class="profile-card">
    <div class="avatar-box" id="avatarDisplay">👦</div>
    <div class="profile-info">
      <div class="profile-name" id="userName">Блогер</div>
      <div class="profile-stats" id="userStats">Баланс: 0.00 €</div>
    </div>
  </div>

  <div class="menu-nav">
    <a href="game.html" class="menu-btn primary">
      <span id="btnStudio">🔴 ВОЙТИ В СТУДИЮ</span>
      <span>▶</span>
    </a>
    <a href="collection.html" class="menu-btn">
      <span id="btnShop">🛒 Магазин и Холдинг</span>
      <span>💎</span>
    </a>
    <a href="avatar.html" class="menu-btn">
      <span id="btnAvatar">🎨 Кастомизация & Студия</span>
      <span>👤</span>
    </a>
    <a href="gallery.html" class="menu-btn">
      <span id="btnGallery">🏆 Награды и Кнопки</span>
      <span>⭐</span>
    </a>
    <a href="leaderboard.html" class="menu-btn">
      <span id="btnRank">📊 Таблица Лидеров</span>
      <span>🌐</span>
    </a>
  </div>

  <div class="footer-info">Tube Empire v5.2 • Telegram Mini App</div>
</div>

<script>
const langMap = {
  ru: { sub: "Idle Streamer Tycoon", studio: "🔴 ВОЙТИ В СТУДИЮ", shop: "🛒 Магазин и Холдинг", avatar: "🎨 Кастомизация & Студия", gallery: "🏆 Награды и Кнопки", rank: "📊 Таблица Лидеров", balance: "Баланс" },
  de: { sub: "Idle Streamer Tycoon", studio: "🔴 INS STUDIO", shop: "🛒 Shop & Konzerne", avatar: "🎨 Anpassung & Studio", gallery: "🏆 Trophäen", rank: "📊 Bestenliste", balance: "Guthaben" },
  en: { sub: "Idle Streamer Tycoon", studio: "🔴 ENTER STUDIO", shop: "🛒 Shop & Holdings", avatar: "🎨 Customization & Studio", gallery: "🏆 Awards & Buttons", rank: "📊 Leaderboard", balance: "Balance" }
};

function updateUI() {
  let lang = Core.getLang();
  let t = langMap[lang] || langMap.ru;

  document.getElementById('subTitle').textContent = t.sub;
  document.getElementById('btnStudio').textContent = t.studio;
  document.getElementById('btnShop').textContent = t.shop;
  document.getElementById('btnAvatar').textContent = t.avatar;
  document.getElementById('btnGallery').textContent = t.gallery;
  document.getElementById('btnRank').textContent = t.rank;

  document.getElementById('langBtn').textContent = lang === 'ru' ? '🇷🇺 RU' : (lang === 'de' ? '🇩🇪 DE' : '🇬🇧 EN');
  document.getElementById('soundBtn').textContent = Core.getSound() ? '🔊 ЗВУК' : '🔇 ВЫКЛ';

  let name = Core.getUserName("Блогер");
  document.getElementById('userName').textContent = name;

  let money = Core.getMoney();
  document.getElementById('userStats').textContent = `${t.balance}: ${money.toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2})} €`;

  // Отображение аватара из кастомизации
  try {
    let s = JSON.parse(localStorage.getItem("tube_empire_avatar_config"));
    if(s) {
      let genders = ['👦','👧'];
      document.getElementById('avatarDisplay').textContent = genders[s.gender] || '👦';
    }
  } catch(e) {}
}

document.addEventListener("DOMContentLoaded", () => {
  updateUI();
});
</script>
</body>
</html>
