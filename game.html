<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Студия</title>
<script src="core.js"></script>
<style>
:root, [data-theme="dark"] {
  --portal-bg: rgba(20, 10, 10, 0.96);
  --border-col: rgba(255, 0, 0, 0.4);
  --accent-col: #ff0000;
  --title-col: #ffcc00;
  --btn-bg: rgba(40, 15, 15, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.03);
  --housing-col: #3498db;
  --text-main: #fff;
  --text-sub: #ff8888;
  --body-bg: #0a0505;
}
[data-theme="rose"] {
  --portal-bg: rgba(30, 10, 25, 0.96);
  --border-col: rgba(233, 30, 99, 0.5);
  --accent-col: #e91e63;
  --title-col: #ffeb3b;
  --btn-bg: rgba(60, 15, 40, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.03);
  --housing-col: #ff4081;
  --text-main: #fff;
  --text-sub: #ff80ab;
  --body-bg: #150510;
}
[data-theme="light"] {
  --portal-bg: rgba(245, 247, 250, 0.96);
  --border-col: rgba(211, 47, 47, 0.4);
  --accent-col: #d32f2f;
  --title-col: #e65100;
  --btn-bg: rgba(255, 255, 255, 0.9);
  --glass-bg: rgba(230, 235, 245, 0.85);
  --housing-col: #0288d1;
  --text-main: #1a1a1a;
  --text-sub: #555555;
  --body-bg: #e0e4ec;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--body-bg);color:var(--text-main);font-family:monospace;overflow:hidden;transition:background 0.3s;}
body{padding:4px;display:flex;justify-content:center;align-items:center;position:fixed;inset:0;}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 6px; z-index: 10; background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 14px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.2); position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px; width: 100%; flex-shrink: 0; font-size: 9.5px; }
.header-left { display: flex; gap: 2px; align-items: center; }
.back-btn { background: rgba(217, 30, 30, 0.85); border: 1px solid #ff4d4d; color: #fff; padding: 2px 4px; border-radius: 4px; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 7px; }
.shop-link-btn, .gallery-link-btn, .rank-link-btn, .avatar-link-btn, .lang-btn { background: var(--glass-bg); border: 1px solid var(--accent-col); color: var(--text-main); padding: 2px 4px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 8px; text-decoration: none; display: flex; align-items: center; justify-content: center; position: relative; }
.mlbb-dot-shop { position: absolute; top: 1px; right: 2px; width: 6px; height: 6px; background: #ff3b30; border-radius: 50%; box-shadow: 0 0 5px #ff3b30; display: none; }
.clicker-body { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 0; width: 100%; gap: 4px; overflow: hidden; }
.resources-container { display: flex; gap: 4px; width: 100%; }
.res-box { flex: 1; background: var(--glass-bg); border: 1px solid var(--border-col); border-radius: 6px; padding: 4px; text-align: center; }
.res-title { font-size: 7px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; }
.res-val { font-size: 14px; font-weight: bold; color: var(--title-col); text-shadow: 0 0 6px rgba(255,204,0,0.4); margin-top: 1px; }
.res-sub { font-size: 7px; color: var(--text-sub); margin-top: 1px; }
.trend-widget { background: var(--glass-bg); border: 1px dashed var(--title-col); border-radius: 6px; padding: 4px 8px; width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 8px; flex-shrink: 0; }
.money-pipe { width: 100%; height: 5px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-col); border-radius: 3px; position: relative; overflow: hidden; }
.money-flow { position: absolute; top: 0; left: -100%; width: 200%; height: 100%; background: repeating-linear-gradient(90deg, transparent, transparent 6px, var(--title-col) 6px, var(--title-col) 12px, var(--text-main) 12px, var(--text-main) 16px); opacity: 0.75; animation: flowMoney 1.5s linear infinite; }
@keyframes flowMoney { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }
.sell-energy-btn { width: 100%; background: var(--btn-bg); border: 1px solid var(--title-col); border-radius: 6px; padding: 5px; color: var(--title-col); font-family: monospace; font-size: 9px; font-weight: bold; cursor: pointer; text-align: center; }
.progress-bar-container { width: 100%; height: 2px; background: rgba(0,0,0,0.1); border-radius: 2px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-col), var(--title-col)); width: 0%; transition: width 0.2s ease; }
.click-target-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; margin: 0; }
.click-target { width: 58px; height: 58px; background: radial-gradient(circle at 35% 35%, var(--accent-col), #800000); border: 2.5px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.4); user-select: none; touch-action: manipulation; }
.click-target:active { transform: scale(0.88); }
.upgrades-list { width: 100%; display: flex; flex-direction: column; gap: 4px; max-height: 170px; overflow-y: auto; padding-right: 2px; }
.upgrade-card { display: flex; justify-content: space-between; align-items: center; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px; padding: 5px 8px; font-size: 9.5px; text-align: left; cursor: pointer; min-height: 38px; }
.upgrade-info { display: flex; flex-direction: column; gap: 1px; }
.upgrade-name { color: var(--title-col); font-weight: bold; font-size: 9px; }
.upgrade-desc { font-size: 6.5px; color: var(--text-sub); }
.upgrade-cost { color: var(--accent-col); font-weight: bold; font-size: 7.5px; }
.upgrade-count { font-size: 9.5px; font-weight: bold; color: var(--text-main); background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border-col); }
@keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-30px) scale(1.15); opacity: 0; } }
.floating-text { position: fixed; color: var(--title-col); font-size: 12px; font-weight: bold; pointer-events: none; z-index: 99999; animation: floatUp 0.35s ease-out forwards; }
</style>
</head>
<body>

<div class="portal">
  <div class="game-ui-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" id="menuBtnTxt">⬅ МЕНЮ</a>
      <a href="collection.html" class="shop-link-btn" id="shopBtnTxt">
        🛒 Магазин
        <span class="mlbb-dot-shop" id="shopDot"></span>
      </a>
      <a href="avatar.html" class="avatar-link-btn" id="avatarBtnTxt">🎨 Студия</a>
      <a href="gallery.html" class="gallery-link-btn" id="galleryBtnTxt">🏆 Награды</a>
      <a href="leaderboard.html" class="rank-link-btn" id="rankBtnTxt">📊 Топ</a>
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">🇷🇺 RU</button>
    </div>
  </div>

  <div class="clicker-body">
    <div class="resources-container">
      <div class="res-box">
        <div class="res-title" id="resBudgetTitle">Баланс (€)</div>
        <div class="res-val" id="moneyTxt">0.00 €</div>
        <div class="res-sub" id="cpsTxt">+0.0 €/сек</div>
      </div>
      <div class="res-box">
        <div class="res-title" id="resEnergyTitle">Просмотры (Mio)</div>
        <div class="res-val" id="energyTxt">0.0M</div>
        <div class="res-sub" id="housingSubTxt">ПК-места: 0/0</div>
      </div>
    </div>

    <div class="trend-widget" id="trendWidget">
      <span id="trendTitle" style="color:var(--title-col); font-weight:bold;">🔥 Тренд: Загрузка...</span>
      <span id="trendTimer" style="color:var(--text-sub);">03:00</span>
    </div>

    <div class="money-pipe"><div class="money-flow"></div></div>
    <button class="sell-energy-btn" id="sellBtnTxt" onclick="sellEnergy()">💰 ВЫВЕСТИ ADDSENSE (1M = 2.50 €)</button>
    <div class="progress-bar-container"><div class="progress-bar-fill" id="progressFill"></div></div>

    <div class="click-target-container">
      <div class="click-target" onclick="clickEnergy(event)">🔴</div>
      <div style="font-size: 7px; color: var(--text-sub);" id="tapHintTxt">Тапай для записи ролика!</div>
    </div>

    <div class="upgrades-list" id="upgradesList"></div>
  </div>
</div>

<script>
const langData = {
  ru: {
    menu: "⬅ МЕНЮ", shop: "🛒 Магазин", studio: "🎨 Студия", gallery: "🏆 Награды", rank: "📊 Топ",
    budget: "Баланс (€)", energy: "Просмотры (Mio)",
    sellBtn: "💰 ВЫВЕСТИ ADDSENSE (1M = 2.50 €)", tapHint: "Тапай для записи ролика!",
    price: "Цена", noSlots: "❌ Нет свободных рабочих мест!",
    items: [
      { name: "💻 Стол для монтажа", desc: "+3 рабочих места в студии", type: "housing" },
      { name: "🏢 Офис-студия блогеров", desc: "+10 рабочих мест в студии", type: "housing" },
      { name: "🧑‍💻 Начинающий клипмейкер", desc: "Авто-монтаж (требует ПК)", type: "worker" },
      { name: "🎥 Сценарист / Оператор", desc: "Профи контента (требует ПК)", type: "worker" },
      { name: "🎬 Продюсерская команда", desc: "Медиа-мастера (требует ПК)", type: "worker" },
      { name: "🤖 Бот для Shorts/Reels", desc: "Авто-генерация роликов", type: "station" },
      { name: "🎙️ Студия подкастов", desc: "Стрим-ферма (+ просмотры)", type: "station" },
      { name: "🌐 Топовая MCN-сеть", desc: "Максимальные просмотры и доход", type: "station" }
    ]
  },
  de: {
    menu: "⬅ MENÜ", shop: "🛒 Shop", studio: "🎨 Studio", gallery: "🏆 Trophäen", rank: "📊 Top",
    budget: "Guthaben (€)", energy: "Aufrufe (Mio)",
    sellBtn: "💰 ADDSENSE AUSZAHLEN (1M = 2.50 €)", tapHint: "Tippen für Video-Upload!",
    price: "Preis", noSlots: "❌ Keine Arbeitsplätze frei!",
    items: [
      { name: "💻 Schnittplatz", desc: "+3 Plätze im Studio", type: "housing" },
      { name: "🏢 Blogger-Studiobüro", desc: "+10 Plätze im Studio", type: "housing" },
      { name: "🧑‍💻 Junior Editor", desc: "Auto-Editing (braucht Platz)", type: "worker" },
      { name: "🎥 Kameramann / Autor", desc: "Content-Profi (braucht Platz)", type: "worker" },
      { name: "🎬 Produzenten-Team", desc: "Medienmeister (braucht Platz)", type: "worker" },
      { name: "🤖 Shorts/Reels Bot", desc: "Auto-Videogenerator", type: "station" },
      { name: "🎙️ Podcast Studio", desc: "Stream-Farm (+ Aufrufe)", type: "station" },
      { name: "🌐 Top MCN-Netzwerk", desc: "Maximale Aufrufe & Ertrag", type: "station" }
    ]
  },
  en: {
    menu: "⬅ MENU", shop: "🛒 Shop", studio: "🎨 Studio", gallery: "🏆 Awards", rank: "📊 Top",
    budget: "Balance (€)", energy: "Views (Mio)",
    sellBtn: "💰 CASHOUT ADDSENSE (1M = 2.50 €)", tapHint: "Tap to record video!",
    price: "Price", noSlots: "❌ No free workspaces!",
    items: [
      { name: "💻 Editing Desk", desc: "+3 studio workspaces", type: "housing" },
      { name: "🏢 Blogger Studio Office", desc: "+10 studio workspaces", type: "housing" },
      { name: "🧑‍💻 Junior Video Editor", desc: "Auto-editing (needs workspace)", type: "worker" },
      { name: "🎥 Scriptwriter / Cameraman", desc: "Content pro (needs workspace)", type: "worker" },
      { name: "🎬 Producer Team", desc: "Media masters (needs workspace)", type: "worker" },
      { name: "🤖 Shorts/Reels Bot", desc: "Auto-video generator", type: "station" },
      { name: "🎙️ Podcast Studio", desc: "Stream farm (+ views)", type: "station" },
      { name: "🌐 Top MCN Network", desc: "Maximum views & earnings", type: "station" }
    ]
  }
};

function toggleLanguage() {
  Core.toggleLang();
  updateLanguageUI();
  updateUI();
}

function updateLanguageUI() {
  let lang = Core.getLang();
  let t = langData[lang] || langData.ru;
  
  const setTxt = (id, val) => { let el = document.getElementById(id); if(el) el.textContent = val; };
  
  setTxt('menuBtnTxt', t.menu);
  setTxt('shopBtnTxt', t.shop);
  setTxt('avatarBtnTxt', t.studio);
  setTxt('galleryBtnTxt', t.gallery);
  setTxt('rankBtnTxt', t.rank);
  setTxt('resBudgetTitle', t.budget);
  setTxt('resEnergyTitle', t.energy);
  setTxt('sellBtnTxt', t.sellBtn);
  setTxt('tapHintTxt', t.tapHint);
  
  let langLabels = { ru: "🇷🇺 RU", de: "🇩🇪 DE", en: "🇬🇧 EN" };
  setTxt('langBtn', langLabels[lang] || "🇷🇺 RU");
}

function getSavedUpgrades() {
  const baseConfigs = [
    { id: 'wagon', baseCost: 100, housingSlots: 3, mult: 1.25, type: 'housing' },
    { id: 'dorm', baseCost: 800, housingSlots: 10, mult: 1.30, type: 'housing' },
    { id: 'azubi', baseCost: 25, incomeEur: 0.1, energyMWh: 0.05, mult: 1.12, type: 'worker' },
    { id: 'elektrik', baseCost: 150, incomeEur: 0.4, energyMWh: 0.1, mult: 1.15, type: 'worker' },
    { id: 'brigade', baseCost: 1200, incomeEur: 2, energyMWh: 0.8, mult: 1.18, type: 'worker' },
    { id: 'wind', baseCost: 9500, incomeEur: 14, energyMWh: 8.5, workersNeeded: 2, mult: 1.20, type: 'station' },
    { id: 'solar', baseCost: 120000, incomeEur: 110, energyMWh: 65, workersNeeded: 8, mult: 1.22, type: 'station' },
    { id: 'aes', baseCost: 1500000, incomeEur: 850, energyMWh: 450, workersNeeded: 30, mult: 1.25, type: 'station' }
  ];

  return baseConfigs.map(cfg => {
    let count = Number(localStorage.getItem("up_" + cfg.id) || 0);
    let cost = cfg.baseCost;
    for(let i = 0; i < count; i++) {
      cost = Math.floor(cost * cfg.mult);
    }
    return { ...cfg, count, cost };
  });
}

let upgrades = getSavedUpgrades();

function getHousingStats() {
  let totalSlots = 0, usedSlots = 0;
  upgrades.forEach(up => {
    if (up.type === 'housing') totalSlots += up.count * up.housingSlots;
    if (up.type === 'worker') usedSlots += up.count;
  });
  return { totalSlots, usedSlots };
}

function clickEnergy(e) {
  let trendMult = Core.getTrendMultiplier();
  let money = Core.getMoney() + (1 * trendMult);
  let energy = Core.getEnergy() + (0.2 * trendMult);
  Core.setMoney(money);
  Core.setEnergy(energy);

  Core.playSound(520, 'triangle', 0.08);
  Core.haptic('light');
  updateUI();

  let pop = document.createElement('div');
  pop.textContent = `+${trendMult}x € / 🔴`; pop.className = "floating-text";
  pop.style.left = (e.clientX - 15) + "px"; pop.style.top = (e.clientY - 25) + "px";
  document.body.appendChild(pop); setTimeout(() => pop.remove(), 350);
}

function sellEnergy() {
  let energy = Core.getEnergy();
  if (energy < 1) { Core.playSound(150, 'sawtooth', 0.15); return; }
  let earned = energy * 2.50;
  let money = Core.getMoney() + earned;
  Core.setMoney(money);
  Core.setEnergy(0);

  Core.playSound(880, 'square', 0.2);
  Core.haptic('heavy');
  updateUI();
}

function buyUpgrade(index) {
  let up = upgrades[index], housing = getHousingStats();
  if (up.type === 'worker' && (housing.totalSlots - housing.usedSlots) <= 0) {
    Core.playSound(120, 'sawtooth', 0.2); Core.haptic('heavy'); return;
  }
  let money = Core.getMoney();
  if (money >= up.cost) {
    money -= up.cost;
    Core.setMoney(money);
    up.count++;
    let nextCost = Math.floor(up.cost * up.mult);
    up.cost = nextCost;
    localStorage.setItem("up_" + up.id, up.count);
    Core.playSound(720, 'square', 0.15);
    Core.haptic('medium');
    updateUI();
  } else {
    Core.playSound(140, 'sawtooth', 0.2);
  }
}

function calculateStats() {
  let totalEurSec = 0, totalEnergySec = 0, housing = getHousingStats();
  let trendMult = Core.getTrendMultiplier();
  
  upgrades.forEach(up => {
    if (up.type === 'worker') {
      totalEurSec += (up.incomeEur || 0) * up.count; 
      totalEnergySec += (up.energyMWh || 0) * up.count;
    } else if (up.type === 'station') {
      let req = (up.workersNeeded || 0) * up.count;
      let eff = req > 0 ? Math.min(1.0, housing.usedSlots / req) : 1.0;
      if (housing.usedSlots === 0 && req > 0) eff = 0.1;
      totalEurSec += ((up.incomeEur || 0) * up.count) * eff;
      totalEnergySec += ((up.energyMWh || 0) * up.count) * eff;
    }
  });

  let corpIncome = Core.getTotalCorporationIncome();
  totalEurSec += corpIncome;

  return { 
    totalEurSec: totalEurSec * trendMult, 
    totalEnergySec: totalEnergySec * trendMult 
  };
}

function updateUI() {
  let stats = calculateStats(), housing = getHousingStats();
  let lang = Core.getLang();
  let t = langData[lang] || langData.ru;
  let money = Core.getMoney();
  let energy = Core.getEnergy();

  const setTxt = (id, val) => { let el = document.getElementById(id); if(el) el.textContent = val; };

  setTxt('moneyTxt', money.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €");
  setTxt('cpsTxt', `+${stats.totalEurSec.toFixed(1)} €/s`);
  setTxt('energyTxt', energy.toFixed(1) + (lang === 'ru' ? "M" : (lang === 'de' ? " Mio" : "M")));
  setTxt('housingSubTxt', `PC: ${housing.usedSlots}/${housing.totalSlots}`);

  let trend = Core.getCurrentTrend();
  let timeLeft = Math.max(0, Math.ceil((trend.expiresAt - Date.now()) / 1000));
  let mins = Math.floor(timeLeft / 60);
  let secs = timeLeft % 60;
  setTxt('trendTitle', `${trend.icon} ${trend.name} (x${trend.mult})`);
  setTxt('trendTimer', `${mins}:${secs < 10 ? '0' : ''}${secs}`);

  let cheapestCost = Math.min(...upgrades.map(u => u.cost));
  let fillEl = document.getElementById('progressFill');
  if(fillEl) fillEl.style.width = Math.min(100, (money / cheapestCost) * 100) + "%";

  let listHtml = "";
  upgrades.forEach((up, idx) => {
    let currentCost = Math.floor(up.cost), canBuy = money >= currentCost, localizedItem = t.items[idx];
    let subInfo = localizedItem.desc;
    if (up.type === 'worker') {
      let freeSlots = housing.totalSlots - housing.usedSlots;
      canBuy = canBuy && freeSlots > 0;
      subInfo = freeSlots > 0 ? `+${up.incomeEur}€/s, +${up.energyMWh}M/s` : `<span style="color:#e74c3c">${t.noSlots}</span>`;
    }
    listHtml += `
      <div class="upgrade-card ${up.type === 'housing' ? 'housing' : ''}" style="opacity: ${canBuy ? 1 : 0.6};" onclick="buyUpgrade(${idx})">
        <div class="upgrade-info">
          <div class="upgrade-name">${localizedItem.name}</div>
          <div class="upgrade-desc">${subInfo}</div>
          <div class="upgrade-cost">${t.price}: ${currentCost.toLocaleString()} €</div>
        </div>
        <div class="upgrade-count">${up.count}</div>
      </div>
    `;
  });
  let listEl = document.getElementById('upgradesList');
  if(listEl) listEl.innerHTML = listHtml;

  // MLBB Красные точки уведомлений
  const luxuryCosts = [1500, 7500, 25000, 85000, 250000, 750000, 2000000, 5500000, 14000000, 35000000, 85000000, 200000000, 450000000, 1000000000, 2200000000, 4800000000, 10000000000, 22000000000, 50000000000, 120000000000];
  let canBuyLuxury = luxuryCosts.some((cost, i) => localStorage.getItem(`lux_${i+1}`) !== "true" && money >= cost);
  let canBuyCorp = Core.getCorporationAssets().some(asset => !Core.isAssetOwned(asset.id) && money >= asset.cost);
  let canBuyUpgrade = upgrades.some(up => money >= up.cost);

  let shopDot = document.getElementById('shopDot');
  if(shopDot) {
    shopDot.style.display = (canBuyLuxury || canBuyCorp || canBuyUpgrade) ? 'block' : 'none';
  }
}

setInterval(() => {
  let stats = calculateStats();
  if (stats.totalEurSec > 0 || stats.totalEnergySec > 0) {
    let money = Core.getMoney() + (stats.totalEurSec / 10);
    let energy = Core.getEnergy() + (stats.totalEnergySec / 10);
    Core.setMoney(money);
    Core.setEnergy(energy);
    updateUI();
  }
}, 100);

document.addEventListener("DOMContentLoaded", () => {
  updateLanguageUI();
  
  // Расчет и показ оффлайн дохода
  let stats = calculateStats();
  let offline = Core.checkOfflineEarnings(stat
