<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Tube Empire</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080b12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
}

.game{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:16px;
    background:
        radial-gradient(
            circle at 50% 10%,
            #303b70 0%,
            #141a2d 40%,
            #080b12 85%
        );
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.online{
    padding:7px 10px;
    border-radius:10px;
    background:#17251d;
    color:#72f7a0;
    font-size:12px;
    font-weight:bold;
}

.balance{
    padding:18px;
    text-align:center;
    border:1px solid #3b486c;
    border-radius:18px;
    background:#111726;
}

.label{
    color:#8c97b0;
    font-size:12px;
    text-transform:uppercase;
}

.money{
    margin-top:5px;
    color:#72f7a0;
    font-size:38px;
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.stat{
    padding:14px;
    border:1px solid #303b57;
    border-radius:14px;
    background:#111624;
}

.stat-title{
    color:#78839d;
    font-size:11px;
}

.stat-value{
