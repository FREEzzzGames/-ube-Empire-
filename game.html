<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube Empire — Studio</title><script src="core.js"></script>
<style>
:root{
  --bg:#070305;
  --p-bg:linear-gradient(135deg, rgba(25,12,18,0.95), rgba(10,5,8,0.98));
  --b-col:rgba(255,50,80,0.35);
  --acc:#ff2a5f;
  --acc-glow:rgba(255,42,95,0.6);
  --t-col:#ffd700;
  --btn:linear-gradient(145deg, #221016, #14080b);
  --txt:#fff;
  --sub:#ff94a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
body{padding:4px;display:flex;justify-content:center;align-items:center;position:fixed;inset:0;}

.portal{
  width:100%;height:100%;max-width:420px;max-height:100vh;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:8px;background:var(--p-bg);border:2px solid var(--b-col);
  border-radius:18px;box-shadow:0 0 30px rgba(255,42,95,0.15), inset 0 0 20px rgba(0,0,0,0.8);
  position:relative;backdrop-filter:blur(10px);
}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:6px;background:var(--btn);border:1px solid var(--b-col);border-radius:10px;font-size:10px;}
.hb{background:linear-gradient(135deg,#e63946,#d90429);border:none;color:#fff;padding:3px 8px;border-radius:6px;font-size:8px;text-decoration:none;font-weight:700;box-shadow:0 2px 6px rgba(213,4,41,0.4);}
.nb{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--txt);padding:3px 6px;border-radius:6px;font-size:9px;text-decoration:none;font-weight:600;position:relative;display:flex;align-items:center;gap:3px;}
.dot{position:absolute;top:2px;right:2px;width:7px;height:7px;background:#ff3b30;border-radius:50%;box-shadow:0 0 8px #ff3b30;display:none;}

.body{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;overflow:hidden;padding:4px 0;}

.row{display:flex;gap:6px;width:100%;}
.box{flex:1;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:6px;text-align:center;box-shadow:inset 0 2px 5px rgba(0,0,0,0.5);}
.bt{font-size:7.5px;color:var(--sub);text-transform:uppercase;font-weight:700;letter-spacing:0.5px;}
.bv{font-size:14px;font-weight:800;color:var(--t-col);margin-top:2px;text-shadow:0 0 10px rgba(255,215,0,0.3);}
.bs{font-size:7.5px;color:var(--sub);margin-top:2px;}

.tr{background:rgba(255,215,0,0.05);border:1px dashed rgba(255,215,0,0.3);border-radius:10px;padding:6px 10px;width:100%;display:flex;justify-content:space-between;font-size:8.5px;align-items:center;}

/* Графическая визуализация студии */
.studio-screen{
  width:100%;height:85px;background:linear-gradient(180deg,#15090f,#0d0407);
  border:2px solid var(--b-col);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;overflow:hidden;
  box-shadow:inset 0 0 15px rgba(0,0,0,0.9);
}
.studio-elements{font-size:26px;filter:drop-shadow(0 0 8px rgba(255,255,255,0.3));z-index:2;display:flex;gap:8px;align-items:center;}
.studio-bg-effect{position:absolute;inset:0;background:radial-gradient(circle at center, rgba(255,42,95,0.12) 0%, transparent 70%);z-index:1;}

.sbtn{width:100%;background:linear-gradient(135deg,#3a121d,#22080f);border:1px solid var(--t-col);border-radius:10px;padding:7px;color:var(--t-col);font-size:9.5px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.4);letter-spacing:0.5px;}

/* Настоящая графическая кнопка записи (Красивый глянцевый мак-стиль / студийная линза) */
.clicker-container{display:flex;flex-direction:column;align-items:center;gap:3px;margin:2px 0;}
.clicker{
  width:72px;height:72px;
  background:radial-gradient(circle at 35% 35%, #ff4d6d 0%, #d90429 55%, #800020 100%);
  border:3px solid #fff;border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;user-select:none;
  box-shadow:0 0 25px var(--acc-glow), 0 8px 20px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.4);
  transition:transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.27), box-shadow 0.08s;
  position:relative;
}
.clicker:active{transform:scale(0.91);box-shadow:0 0 12px var(--acc-glow), 0 3px 10px rgba(0,0,0,0.6), inset 0 2px 5px rgba(0,0,0,0.4);}
.clicker::after{content:'';position:absolute;top:6px;left:12px;width:24px;height:12px;background:rgba(255,255,255,0.25);border-radius:50%;transform:rotate(-25deg);}

.list{width:100%;display:flex;flex-direction:column;gap:5px;max-height:155px;overflow-y:auto;padding-right:2px;}
.card{display:flex;justify-content:space-between;align-items:center;background:var(--btn);border:1px solid var(--b-col);border-radius:10px;padding:6px 10px;font-size:9.5px;cursor:pointer;min-height:40px;text-align:left;box-shadow:0 2px 5px rgba(0,0,0,0.2);}
.card:hover{border-color:var(--acc);background:linear-gradient(145deg, #2d141c, #190a0f);}
.cn{color:var(--t-col);font-weight:700;font-size:9.5px;}
.cd{font-size:7px;color:var(--sub);margin-top:1px;}
.cc{color:var(--acc);font-weight:700;font-size:8px;margin-top:1px;}
.cnt{font-size:10px;font-weight:800;background:rgba(0,0,0,0.4);padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);color:#fff;}

@keyframes pop{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-30px) scale(1.2);opacity:0;}}
.pop-txt{position:fixed;color:var(--t-col);font-size:13px;font-weight:800;pointer-events:none;z-index:999;animation:pop 0.4s ease-out forwards;text-shadow:0 0 8px rgba(255,215,0,0.6);}
</style>
</head>
<body>
<div class="portal">
  <div class="hdr">
    <div style="display:flex;gap:4px;align-items:center;">
      <a href="index.html" class="hb" id="mBtn">⬅ МЕНЮ</a>
      <a href="collection.html" class="nb" id="sBtn">🛒 Магазин<span class="dot" id="sDot"></span></a>
      <a href="avatar.html" class="nb" id="aBtn">🎨 Студия</a>
      <a href="gallery.html" class="nb" id="gBtn">🏆</a>
      <a href="leaderboard.html" class="nb" id="rBtn">📊</a>
      <button class="nb" onclick="Core.toggleLang();loc();upd();" id="lBtn">🇷🇺</button>
    </div>
  </div>
  
  <div class="body">
    <div class="row">
      <div class="box"><div class="bt" id="t1">Баланс (€)</div><div class="bv" id="mTxt">0.00 €</div><div class="bs" id="cTxt">+0.0 €/s</div></div>
      <div class="box"><div class="bt" id="t2">Просмотры</div><div class="bv" id="eTxt">0.0M</div><div class="bs" id="hTxt">ПК: 0/0</div></div>
    </div>
    
    <div class="tr"><span id="trName" style="color:var(--t-col);font-weight:700;">🔥 Тренд</span><span id="trTime" style="color:var(--sub);">03:00</span></div>
    
    <!-- Графическое окно студии -->
    <div class="studio-screen">
      <div class="studio-bg-effect"></div>
      <div class="studio-elements" id="studioView">🎙️ 💻 💡</div>
    </div>

    <div style="width:100%;height:4px;background:rgba(0,0,0,0.3);border-radius:2px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;width:200%;background:repeating-linear-gradient(90deg,transparent,transparent 6px,var(--t-col) 6px,var(--t-col) 12px);animation:fl 1.5s linear infinite;"></div></div>
    
    <button class="sbtn" id="sellTxt" onclick="sell()">💰 ВЫВЕСТИ ADDSENSE (1M = 2.50 €)</button>
    <div style="width:100%;height:2px;background:rgba(0,0,0,0.2);border-radius:2px;"><div id="pFill" style="height:100%;background:linear-gradient(90deg,var(--acc),var(--t-col));width:0%;"></div></div>
    
    <div class="clicker-container">
      <div class="clicker" onclick="tap(event)">
        <div style="width:24px;height:24px;border:2.5px solid rgba(255,255,255,0.8);border-radius:50%;display:flex;justify-content:center;align-items:center;">
          <div style="width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;"></div>
        </div>
      </div>
      <div style="font-size:7.5px;color:var(--sub);font-weight:600;" id="tapTxt">Тапай для записи ролика!</div>
    </div>
    
    <div class="list" id="uList"></div>
  </div>
</div>
<style>@keyframes fl{0%{transform:translateX(0);}100%{transform:translateX(50%);}}</style>
<script>
const T = {
  ru:{m:"⬅ МЕНЮ",s:"🛒 Магазин",a:"🎨 Студия",b1:"Баланс (€)",b2:"Просмотры",sell:"💰 ВЫВЕСТИ ADDSENSE (1M = 2.50 €)",tap:"Тапай для записи ролика!",pr:"Цена",ns:"❌ Нет ПК!"},
  de:{m:"⬅ MENÜ",s:"🛒 Shop",a:"🎨 Studio",b1:"Guthaben (€)",b2:"Aufrufe",sell:"💰 ADDSENSE AUSZAHLEN (1M = 2.50 €)",tap:"Tippen!",pr:"Preis",ns:"❌ Kein Platz!"},
  en:{m:"⬅ MENU",s:"🛒 Shop",a:"🎨 Studio",b1:"Balance (€)",b2:"Views",sell:"💰 CASHOUT ADDSENSE (1M = 2.50 €)",tap:"Tap to record!",pr:"Price",ns:"❌ No PCs!"}
};
function loc(){
  let l=Core.getLang(), t=T[l]||T.ru;
  document.getElementById('mBtn').textContent=t.m;
  document.getElementById('sBtn').firstChild.textContent=t.s+" ";
  document.getElementById('aBtn').textContent=t.a;
  document.getElementById('lBtn').textContent=l==='ru'?'🇷🇺':(l==='de'?'🇩🇪':'🇬🇧');
  document.getElementById('t1').textContent=t.b1; document.getElementById('t2').textContent=t.b2;
  document.getElementById('sellTxt').textContent=t.sell; document.getElementById('tapTxt').textContent=t.tap;
}
const cfg=[
  {id:'wagon',base:100,slots:3,mult:1.25,type:'housing'},{id:'dorm',base:800,slots:10,mult:1.3,type:'housing'},
  {id:'azubi',base:25,inc:0.1,eng:0.05,mult:1.12,type:'worker'},{id:'elektrik',base:150,inc:0.4,eng:0.1,mult:1.15,type:'worker'},
  {id:'brigade',base:1200,inc:2,eng:0.8,mult:1.18,type:'worker'},{id:'wind',base:9500,inc:14,eng:8.5,req:2,mult:1.2,type:'station'},
  {id:'solar',base:120000,inc:110,eng:65,req:8,mult:1.22,type:'station'},{id:'aes',base:1500000,inc:850,eng:450,req:30,mult:1.25,type:'station'}
];
const names=[{n:"💻 Стол монтажа",d:"+3 места"},{n:"🏢 Офис",d:"+10 мест"},{n:"🧑‍💻 Клипмейкер",d:"Авто-монтаж"},{n:"🎥 Оператор",d:"Профи"},{n:"🎬 Продюсеры",d:"Мастера"},{n:"🤖 Shorts Бот",d:"Генератор"},{n:"🎙️ Подкасты",d:"Стрим-ферма"},{n:"🌐 MCN-сеть",d:"Макс охват"}];

let ups=cfg.map(c=>{
  let cnt=Number(localStorage.getItem("up_"+c.id)||0), cost=c.base;
  for(let i=0;i<cnt;i++) cost=Math.floor(cost*c.mult);
  return {...c, count:cnt, cost};
});
function getH(){
  let tot=0,used=0; ups.forEach(u=>{if(u.type==='housing')tot+=u.count*u.slots;if(u.type==='worker')used+=u.count;});
  return {tot,used};
}

function updateStudioVisuals(){
  try {
    let st = JSON.parse(localStorage.getItem("tube_empire_studio_config") || '{"walls":0,"neon":0,"poster":0,"pet":0}');
    let walls = ['🧱', '🪵', '🟫', '⬛', '🟦'][st.walls] || '🧱';
    let neon = ['🔴', '🔵', '🟢', '🟣', '🟡'][st.neon] || '🔴';
    let poster = ['🖼️', '🎮', '🚀', '🔥', '⭐'][st.poster] || '🖼️';
    let pet = ['❌', '🐱', '🐶', '🤖', '🦜'][st.pet] || '❌';
    document.getElementById('studioView').innerHTML = `${walls} ${poster} ${neon} ${pet !== '❌' ? pet : '🎙️'}`;
  } catch(e) {}
}

function tap(e){
  let m=Core.getTrendMultiplier();
  Core.setMoney(Core.getMoney()+m); Core.setEnergy(Core.getEnergy()+0.2*m);
  Core.playSound(520,'triangle',0.08); Core.haptic('light'); upd();
  let p=document.createElement('div'); p.className='pop-txt'; p.textContent=`+${m}x €`;
  p.style.left=(e.clientX-15)+'px'; p.style.top=(e.clientY-25)+'px';
  document.body.appendChild(p); setTimeout(()=>p.remove(),400);
}
function sell(){
  let e=Core.getEnergy(); if(e<1){Core.playSound(150,'sawtooth',0.15);return;}
  Core.setMoney(Core.getMoney()+e*2.5); Core.setEnergy(0);
  Core.playSound(880,'square',0.2); Core.haptic('heavy'); upd();
}
function buy(i){
  let u=ups[i], h=getH(); if(u.type==='worker'&&(h.tot-h.used)<=0){Core.playSound(120,'sawtooth',0.2);return;}
  let mon=Core.getMoney();
  if(mon>=u.cost){
    Core.setMoney(mon-u.cost); u.count++; u.cost=Math.floor(u.cost*u.mult);
    localStorage.setItem("up_"+u.id,u.count);
    Core.playSound(720,'square',0.15); Core.haptic('medium'); upd();
  }else{Core.playSound(140,'sawtooth',0.2);}
}
function calc(){
  let eur=0,eng=0,h=getH(),tm=Core.getTrendMultiplier();
  ups.forEach(u=>{
    if(u.type==='worker'){eur+=u.inc*u.count;eng+=u.eng*u.count;}
    else if(u.type==='station'){
      let req=u.req*u.count, eff=req>0?Math.min(1,h.used/req):1;
      if(h.used===0&&req>0)eff=0.1;
      eur+=u.inc*u.count*eff; eng+=u.eng*u.count*eff;
    }
  });
  eur+=Core.getTotalCorporationIncome();
  return {eur:eur*tm, eng:eng*tm};
}
function upd(){
  let st=calc(), h=getH(), t=T[Core.getLang()]||T.ru, mon=Core.getMoney(), eng=Core.getEnergy();
  document.getElementById('mTxt').textContent=mon.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  document.getElementById('cTxt').textContent=`+${st.eur.toFixed(1)} €/s`;
  document.getElementById('eTxt').textContent=eng.toFixed(1)+"M";
  document.getElementById('hTxt').textContent=`ПК: ${h.used}/${h.tot}`;
  
  let tr=Core.getCurrentTrend(), left=Math.max(0,Math.ceil((tr.expiresAt-Date.now())/1000));
  document.getElementById('trName').textContent=`${tr.icon} ${tr.name} (x${tr.mult})`;
  document.getElementById('trTime').textContent=`${Math.floor(left/60)}:${('0'+(left%60)).slice(-2)}`;

  let cheap=Math.min(...ups.map(u=>u.cost));
  document.getElementById('pFill').style.width=Math.min(100,(mon/cheap)*100)+"%";

  let html="";
  ups.forEach((u,idx)=>{
    let can=mon>=u.cost, nm=names[idx], desc=nm.d;
    if(u.type==='worker'){
      let free=h.tot-h.used; can=can&&free>0;
      desc=free>0?`+${u.inc}€/s`:t.ns;
    }
    html+=`<div class="card" style="opacity:${can?1:0.6};" onclick="buy(${idx})"><div style="display:flex;flex-direction:column;gap:1px;"><div class="cn">${nm.n}</div><div class="cd">${desc}</div><div class="cc">${t.pr}: ${u.cost.toLocaleString()} €</div></div><div class="cnt">${u.count}</div></div>`;
  });
  document.getElementById('uList').innerHTML=html;

  let luxC=[1500,7500,25000,85000,250000,750000,2000000,5500000,14000000,35000000,85000000,200000000,450000000,1000000000,2200000000,4800000000,10000000000,22000000000,50000000000,120000000000];
  let dot=luxC.some((c,i)=>localStorage.getItem(`lux_${i+1}`)!=="true"&&mon>=c)||Core.getCorporationAssets().some(a=>!Core.isAssetOwned(a.id)&&mon>=a.cost)||ups.some(u=>mon>=u.cost);
  document.getElementById('sDot').style.display=dot?'block':'none';
  
  updateStudioVisuals();
}
setInterval(()=>{let st=calc();if(st.eur>0||st.eng>0){Core.setMoney(Core.getMoney()+st.eur/10);Core.setEnergy(Core.getEnergy()+st.eng/10);upd();}},100);
document.addEventListener("DOMContentLoaded",()=>{
  loc();
  let st=calc(), off=Core.checkOfflineEarnings(st.eur,st.eng);
  if(off){setTimeout(()=>alert(`📈 Оффлайн-доход:\n💰 +${off.money.toFixed(2)} €\n🔴 +${off.energy.toFixed(1)}M`),400);}
  upd();
});
</script>
</body>
</html>
